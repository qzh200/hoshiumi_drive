<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoshiumi Drive</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <div><p class="eyebrow">PRIVATE CLOUD STORAGE</p><h1>Hoshiumi Drive</h1></div>
        <div class="account"><span id="mode">只读访问</span><button id="login">密钥登录</button><button id="logout" hidden>退出</button></div>
      </header>
      <nav><button id="up" title="返回上级" disabled>↑</button><span id="crumb">根目录</span></nav>
      <section id="tools" hidden>
        <label class="action">上传文件<input id="upload" type="file" multiple /></label>
        <button id="new-folder">新建文件夹</button>
      </section>
      <p id="notice" role="status"></p>
      <section id="list" aria-live="polite"><p class="loading">正在载入文件...</p></section>
    </main>
    <dialog id="login-dialog"><form id="login-form"><h2>密钥登录</h2><label>主密钥<input id="key" type="password" autocomplete="current-password" required /></label><p class="hint">登录后可上传和管理文件。</p><div><button type="button" id="cancel">取消</button><button>登录</button></div></form></dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
