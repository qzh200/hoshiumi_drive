# =============================================================================
# storage.yaml —— Drive 后端配置
# =============================================================================
# 这里是 Drive 后端运行时使用的「非敏感」配置（构建时由
# scripts/build-storage-config.mjs 编译进 functions/_config.generated.json，
# 供 Cloudflare Pages Functions 在每次请求中加载）。
#
# 敏感凭据（master key、WebDAV 用户名/密码）请勿写在这里：
#   - 本地开发  → 写入项目根目录的 .dev.vars（已被 .gitignore 忽略）
#   - 生产环境  → 使用 `wrangler pages secret put <NAME>` 注入
#
# YAML 字段会作为「默认值」；当同名 env 变量存在时，env 始终覆盖 YAML。
# 这样既保留「一处配置」的便利，又符合 Cloudflare 的 secret 边界。
# =============================================================================

storage:
  # 存储驱动。当前仅实现 webdav。
  driver: webdav

  webdav:
    # WebDAV 服务根地址（不带末尾斜杠）。
    endpoint: https://pan.moe/dav

    # 下列两项默认从 env 拿（WEBDAV_USERNAME / WEBDAV_PASSWORD），
    # 仅当你想把默认凭据一并提交到 yaml 时才填写（不推荐）。
    # 留空时，Functions 强制要求 env 注入。
    username: ""
    password: ""

  # 上传/下载等操作的客户端限制（仅用于早期快速失败，节省到后端的流量）。
  upload:
    # 单个文件最大字节数；空字符串或 0 表示不限制。
    maxFileSize: ""

  # 操作超时（毫秒）。到 WebDAV 的请求在该时间内未完成则中断。
  requestTimeoutMs: 30000

# =============================================================================
# 身份认证 / 会话
# =============================================================================
auth:
  # 主密钥名称（仅用于登录提示文案，Functions 仍从 env.DRIVE_MASTER_KEY 读取真实密钥）。
  keyLabel: 主密钥

  # 会话有效期（天）。到期后自动清理。
  sessionTtlDays: 7
